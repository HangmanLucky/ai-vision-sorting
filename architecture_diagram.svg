<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#241f3d" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#0c0a16"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="680" fill="none" stroke="#b79cff" stroke-width="1.5"/>

  <text x="40" y="52" fill="#f1eefb" font-size="21" font-weight="700" letter-spacing="1">AI-DRIVEN EDGE VISION INTEGRATION</text>
  <text x="40" y="76" fill="#c4b6f5" font-size="13">PLC-Controlled Neural Network Sorting Matrix &#8212; Integration Architecture</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#b79cff" stroke-width="1"/>

  <!-- Camera / conveyor -->
  <rect x="60" y="150" width="140" height="70" fill="none" stroke="#4fe0e8" stroke-width="1.6"/>
  <text x="130" y="180" fill="#8fe9ee" font-size="12" text-anchor="middle" font-weight="700">CAMERA</text>
  <text x="130" y="198" fill="#c4b6f5" font-size="9" text-anchor="middle">Inspection point</text>

  <line x1="200" y1="185" x2="280" y2="185" stroke="#f1eefb" stroke-width="2"/>
  <text x="240" y="175" fill="#8f86bd" font-size="8" text-anchor="middle">image capture</text>

  <!-- Edge PC -->
  <rect x="280" y="140" width="220" height="130" fill="none" stroke="#9d6bff" stroke-width="1.8"/>
  <text x="390" y="172" fill="#c9aeff" font-size="13" text-anchor="middle" font-weight="700">EDGE AI SERVICE (PYTHON)</text>
  <text x="390" y="190" fill="#c4b6f5" font-size="10" text-anchor="middle">ai_sorting_service.py</text>
  <text x="390" y="206" fill="#c4b6f5" font-size="10" text-anchor="middle">TinyMLP (numpy, hand-trained)</text>
  <text x="390" y="222" fill="#8f86bd" font-size="9" text-anchor="middle">5 features -&gt; 8 hidden -&gt; 2 classes</text>
  <text x="390" y="238" fill="#8f86bd" font-size="9" text-anchor="middle">94.4% held-out test accuracy</text>
  <text x="390" y="254" fill="#4fe0e8" font-size="9" text-anchor="middle">Modbus TCP CLIENT</text>

  <line x1="500" y1="205" x2="600" y2="205" stroke="#4fe0e8" stroke-width="2"/>
  <text x="550" y="193" fill="#8fe9ee" font-size="8" text-anchor="middle">Modbus TCP</text>
  <text x="550" y="222" fill="#8f86bd" font-size="8" text-anchor="middle">HR0-HR6, port 5020</text>

  <!-- PLC -->
  <rect x="600" y="140" width="220" height="130" fill="none" stroke="#f5a623" stroke-width="1.8"/>
  <text x="710" y="172" fill="#f5c56b" font-size="13" text-anchor="middle" font-weight="700">PLC (MODBUS SERVER)</text>
  <text x="710" y="190" fill="#c4b6f5" font-size="10" text-anchor="middle">Siemens S7-1500</text>
  <text x="710" y="206" fill="#c4b6f5" font-size="10" text-anchor="middle">FB_AI_SortingMatrix</text>
  <text x="710" y="222" fill="#8f86bd" font-size="9" text-anchor="middle">Conveyor tracking queue (depth 5)</text>
  <text x="710" y="238" fill="#8f86bd" font-size="9" text-anchor="middle">Confidence trust thresholds</text>
  <text x="710" y="254" fill="#8f86bd" font-size="9" text-anchor="middle">AI heartbeat watchdog</text>

  <line x1="710" y1="270" x2="710" y2="330" stroke="#f5a623" stroke-width="2"/>

  <!-- Diverter -->
  <rect x="600" y="330" width="220" height="80" fill="none" stroke="#f1eefb" stroke-width="1.6"/>
  <text x="710" y="362" fill="#f1eefb" font-size="12" text-anchor="middle" font-weight="700">SORTING DIVERTER</text>
  <text x="710" y="380" fill="#c4b6f5" font-size="10" text-anchor="middle">3-position arm</text>
  <text x="710" y="396" fill="#8f86bd" font-size="9" text-anchor="middle">PASS / REJECT / MANUAL REVIEW</text>

  <!-- Fail-safe box -->
  <rect x="880" y="140" width="240" height="130" fill="none" stroke="#ef4b4b" stroke-width="1.6"/>
  <text x="1000" y="168" fill="#ff9d9d" font-size="12" text-anchor="middle" font-weight="700">FAIL-SAFE LOGIC</text>
  <text x="1000" y="188" fill="#c4b6f5" font-size="9" text-anchor="middle">AI offline -&gt; all items to MANUAL</text>
  <text x="1000" y="204" fill="#c4b6f5" font-size="9" text-anchor="middle">Confidence &lt; 90% -&gt; MANUAL</text>
  <text x="1000" y="220" fill="#c4b6f5" font-size="9" text-anchor="middle">No result by transit deadline -&gt; MANUAL</text>
  <text x="1000" y="240" fill="#8f86bd" font-size="8" text-anchor="middle">The PLC never blindly trusts a</text>
  <text x="1000" y="253" fill="#8f86bd" font-size="8" text-anchor="middle">borderline or missing AI verdict</text>
  <line x1="880" y1="205" x2="820" y2="205" stroke="#ef4b4b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Test harness note -->
  <rect x="280" y="330" width="220" height="80" fill="none" stroke="#4fe0e8" stroke-width="1.4"/>
  <text x="390" y="358" fill="#8fe9ee" font-size="11" text-anchor="middle" font-weight="700">TEST HARNESS</text>
  <text x="390" y="376" fill="#c4b6f5" font-size="9" text-anchor="middle">plc_simulator.py</text>
  <text x="390" y="392" fill="#8f86bd" font-size="8" text-anchor="middle">Hand-written Modbus TCP server,</text>
  <text x="390" y="403" fill="#8f86bd" font-size="8" text-anchor="middle">stands in for the real PLC in testing</text>
  <line x1="390" y1="330" x2="390" y2="270" stroke="#4fe0e8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Title block -->
  <rect x="880" y="600" width="290" height="70" fill="none" stroke="#b79cff" stroke-width="1"/>
  <text x="895" y="618" fill="#f1eefb" font-size="10">DWG NO: AI-SORTING-ARCH-001</text>
  <text x="895" y="633" fill="#f1eefb" font-size="10">REV: A &#8212; SIMULATION / PORTFOLIO BUILD</text>
  <text x="895" y="648" fill="#f1eefb" font-size="10">AUTHOR: SIPHO LUCKY SIBANDA</text>
  <text x="895" y="663" fill="#c4b6f5" font-size="9">NOT FOR PRODUCTION DEPLOYMENT</text>
</svg>
